[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-linux"
version = "0.1.0"
description = "A developer-focused Linux desktop environment with an integrated computer-side agent."
requires-python = ">=3.11"
dependencies = [
    "PySide6"
]

[project.scripts]
forge = "forge.main:main"

[tool.setuptools.packages.find]
where = ["src"]